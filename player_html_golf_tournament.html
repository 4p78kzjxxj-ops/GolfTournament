<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Player Match</title>

  <style>
    :root {
      --bg: #08110d;
      --card: #101c17;
      --card2: #16251f;
      --text: #f8fafc;
      --muted: #9ca3af;
      --green: #16a34a;
      --green2: #22c55e;
      --red: #dc2626;
      --blue: #2563eb;
      --gold: #f5c542;
      --border: rgba(255,255,255,0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top, rgba(34, 197, 94, 0.18), transparent 30%),
        linear-gradient(180deg, #06351f 0%, var(--bg) 45%, #020617 100%);
    }

    .page {
      width: min(980px, 100%);
      margin: 0 auto;
      padding: 18px 14px 40px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    .topbar h1 {
      margin: 0;
      font-size: clamp(28px, 6vw, 42px);
    }

    .topbar p {
      margin: 4px 0 0;
      color: #d1fae5;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(22, 163, 74, 0.18);
      border: 1px solid rgba(22, 163, 74, 0.35);
      color: #bbf7d0;
      font-size: 13px;
      font-weight: 700;
    }

    .card {
      background: rgba(16, 28, 23, 0.92);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 18px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
      margin-bottom: 16px;
      backdrop-filter: blur(10px);
    }

    .card h2,
    .card h3 {
      margin-top: 0;
    }

    .muted {
      color: var(--muted);
    }

    .team-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 12px;
    }

    .team-box {
      border-radius: 18px;
      padding: 14px;
      border: 1px solid var(--border);
      background: rgba(2, 6, 23, 0.78);
    }

    .red-team {
      border-left: 5px solid var(--red);
    }

    .blue-team {
      border-left: 5px solid var(--blue);
    }

    .scoreboard {
      display: grid;
      gap: 12px;
    }

    .hole-card {
      background: rgba(2, 6, 23, 0.82);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 16px;
    }

    .hole-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .hole-title {
      font-size: 22px;
      font-weight: 900;
    }

    .hole-status {
      font-size: 13px;
      font-weight: 700;
      color: #d1fae5;
      background: rgba(22, 163, 74, 0.18);
      border: 1px solid rgba(22, 163, 74, 0.32);
      border-radius: 999px;
      padding: 6px 10px;
    }

    .scores-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .score-team {
      border-radius: 16px;
      padding: 12px;
      background: rgba(15, 23, 42, 0.78);
      border: 1px solid var(--border);
    }

    .score-team.red {
      border-left: 5px solid var(--red);
    }

    .score-team.blue {
      border-left: 5px solid var(--blue);
    }

    .score-team label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 8px;
      font-weight: 800;
    }

    .score-input {
      width: 100%;
      min-height: 64px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: #020617;
      color: var(--text);
      text-align: center;
      font-size: 30px;
      font-weight: 900;
    }

    .save-btn {
      width: 100%;
      margin-top: 14px;
      border: 0;
      border-radius: 18px;
      min-height: 54px;
      background: linear-gradient(135deg, var(--green), var(--green2));
      color: white;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
    }

    .winner-bar {
      margin-top: 14px;
      border-radius: 16px;
      padding: 12px;
      text-align: center;
      font-weight: 900;
      font-size: 15px;
    }

    .winner-red {
      background: rgba(220, 38, 38, 0.18);
      border: 1px solid rgba(220, 38, 38, 0.35);
      color: #fecaca;
    }

    .winner-blue {
      background: rgba(37, 99, 235, 0.18);
      border: 1px solid rgba(37, 99, 235, 0.35);
      color: #bfdbfe;
    }

    .winner-tie {
      background: rgba(245, 197, 66, 0.18);
      border: 1px solid rgba(245, 197, 66, 0.35);
      color: #fde68a;
    }

    .empty-state {
      text-align: center;
      padding: 80px 18px;
    }

    .empty-state h2 {
      margin-bottom: 10px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 18px;
      min-height: 52px;
      padding: 0 18px;
      border-radius: 16px;
      background: rgba(255,255,255,0.08);
      border: 1px solid var(--border);
      color: white;
      text-decoration: none;
      font-weight: 800;
    }

    @media (max-width: 820px) {
      .team-grid,
      .scores-grid {
        grid-template-columns: 1fr;
      }

      .topbar {
        flex-direction: column;
        align-items: flex-start;
      }

      .hole-top {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="topbar">
      <div>
        <h1>Player Match</h1>
        <p>Enter your team's best ball score for each hole.</p>
      </div>

      <div class="status" id="connectionStatus">Connecting to Firebase...</div>
    </div>

    <div id="content"></div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import {
      getDatabase,
      ref,
      onValue,
      update
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";

    const firebaseConfig = {
      apiKey: "PASTE_YOUR_API_KEY_HERE",
      authDomain: "golftournament-44a54.firebaseapp.com",
      databaseURL: "https://golftournament-44a54-default-rtdb.firebaseio.com",
      projectId: "golftournament-44a54",
      storageBucket: "golftournament-44a54.firebasestorage.app",
      messagingSenderId: "PASTE_YOUR_SENDER_ID_HERE",
      appId: "PASTE_YOUR_APP_ID_HERE"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const content = document.getElementById("content");
    const connectionStatus = document.getElementById("connectionStatus");

    let tournaments = {};

    const params = new URLSearchParams(window.location.search);
    const playerCode = params.get("code") || "";

    onValue(ref(db, ".info/connected"), snapshot => {
      connectionStatus.textContent = snapshot.val()
        ? "Connected to Firebase"
        : "Disconnected";
    });

    onValue(ref(db, "tournaments"), snapshot => {
      tournaments = snapshot.val() || {};
      render();
    });

    function render() {
      if (!/^\d{4}$/.test(playerCode)) {
        showError("Missing or invalid player code.");
        return;
      }

      const matchData = findPlayerMatch(playerCode);

      if (!matchData) {
        showError("No active match found for this player code.");
        return;
      }

      const {
        tournamentId,
        tournament,
        matchId,
        match,
        player,
        redPlayers,
        bluePlayers
      } = matchData;

      content.innerHTML = `
        <div class="card">
          <h2>${escapeHtml(tournament.name || "Tournament")}</h2>
          <div class="muted">${escapeHtml(match.name || "Match")}</div>

          <div class="team-grid">
            <div class="team-box red-team">
              <strong>Red Team</strong>
              <div style="margin-top:8px; display:grid; gap:6px;">
                ${redPlayers.map(p => `<div>${escapeHtml(p.name)}</div>`).join("")}
              </div>
            </div>

            <div class="team-box blue-team">
              <strong>Blue Team</strong>
              <div style="margin-top:8px; display:grid; gap:6px;">
                ${bluePlayers.map(p => `<div>${escapeHtml(p.name)}</div>`).join("")}
              </div>
            </div>
          </div>
        </div>

        <div class="scoreboard">
          ${renderHoles(tournamentId, matchId, match)}
        </div>

        <a href="index.html" class="back-btn">Back to Home</a>
      `;

      attachSaveHandlers(tournamentId, matchId, match);
    }

    function renderHoles(tournamentId, matchId, match) {
      let html = "";

      for (let i = 1; i <= 18; i++) {
        const holeData = match.holes?.[i] || {};

        const redScore = holeData.redScore || "";
        const blueScore = holeData.blueScore || "";

        let winnerClass = "winner-tie";
        let winnerText = "Waiting for scores";

        if (redScore && blueScore) {
          if (Number(redScore) < Number(blueScore)) {
            winnerClass = "winner-red";
            winnerText = "Red Team Wins Hole";
          } else if (Number(blueScore) < Number(redScore)) {
            winnerClass = "winner-blue";
            winnerText = "Blue Team Wins Hole";
          } else {
            winnerClass = "winner-tie";
            winnerText = "Hole Tied";
          }
        }

        html += `
          <div class="hole-card">
            <div class="hole-top">
              <div class="hole-title">Hole ${i}</div>
              <div class="hole-status">Best Ball Scoring</div>
            </div>

            <div class="scores-grid">
              <div class="score-team red">
                <label>Red Team Lowest Score</label>
                <input
                  class="score-input"
                  type="number"
                  min="1"
                  max="20"
                  value="${escapeHtml(redScore)}"
                  id="red-${i}"
                />
              </div>

              <div class="score-team blue">
                <label>Blue Team Lowest Score</label>
                <input
                  class="score-input"
                  type="number"
                  min="1"
                  max="20"
                  value="${escapeHtml(blueScore)}"
                  id="blue-${i}"
                />
              </div>
            </div>

            <button class="save-btn" data-hole="${i}">
              Save Hole ${i}
            </button>

            <div class="winner-bar ${winnerClass}">
              ${winnerText}
            </div>
          </div>
        `;
      }

      return html;
    }

    function attachSaveHandlers(tournamentId, matchId, match) {
      document.querySelectorAll(".save-btn").forEach(button => {
        button.addEventListener("click", async () => {
          const hole = button.dataset.hole;

          const redInput = document.getElementById(`red-${hole}`);
          const blueInput = document.getElementById(`blue-${hole}`);

          const redScore = redInput.value.trim();
          const blueScore = blueInput.value.trim();

          if (!redScore || !blueScore) {
            alert("Enter both scores.");
            return;
          }

          const redNum = Number(redScore);
          const blueNum = Number(blueScore);

          if (redNum < 1 || blueNum < 1) {
            alert("Scores must be greater than 0.");
            return;
          }

          await update(ref(db, `tournaments/${tournamentId}/matches/${matchId}/holes/${hole}`), {
            redScore: redNum,
            blueScore: blueNum
          });
        });
      });
    }

    function findPlayerMatch(code) {
      for (const [tournamentId, tournament] of Object.entries(tournaments)) {
        const players = tournament.players || {};
        const matches = tournament.matches || {};

        let matchingPlayer = null;

        for (const [playerId, player] of Object.entries(players)) {
          if (player.code === code) {
            matchingPlayer = {
              id: playerId,
              ...player
            };
            break;
          }
        }

        if (!matchingPlayer) continue;

        for (const [matchId, match] of Object.entries(matches)) {
          const ids = [...(match.red || []), ...(match.blue || [])];

          if (!ids.includes(matchingPlayer.id)) continue;

          const redPlayers = (match.red || []).map(id => ({
            id,
            ...(players[id] || {})
          }));

          const bluePlayers = (match.blue || []).map(id => ({
            id,
            ...(players[id] || {})
          }));

          return {
            tournamentId,
            tournament,
            matchId,
            match,
            player: matchingPlayer,
            redPlayers,
            bluePlayers
          };
        }
      }

      return null;
    }

    function showError(message) {
      content.innerHTML = `
        <div class="card empty-state">
          <h2>Match Not Found</h2>
          <div class="muted">${escapeHtml(message)}</div>

          <a href="index.html" class="back-btn">
            Back to Home
          </a>
        </div>
      `;
    }

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
