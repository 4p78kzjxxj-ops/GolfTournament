<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Player Match</title>

  <style>
    :root {
      --bg: #08110d;
      --card: #101c17;
      --card2: #16251f;
      --text: #f8fafc;
      --muted: #9ca3af;
      --green: #16a34a;
      --green2: #22c55e;
      --red: #dc2626;
      --blue: #2563eb;
      --gold: #f5c542;
      --border: rgba(255,255,255,0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top, rgba(34, 197, 94, 0.18), transparent 30%),
        linear-gradient(180deg, #06351f 0%, var(--bg) 45%, #020617 100%);
    }

    .page {
      width: min(760px, 100%);
      margin: 0 auto;
      padding: 18px 14px 40px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    .topbar h1 {
      margin: 0;
      font-size: clamp(28px, 6vw, 42px);
    }

    .topbar p {
      margin: 4px 0 0;
      color: #d1fae5;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(22, 163, 74, 0.18);
      border: 1px solid rgba(22, 163, 74, 0.35);
      color: #bbf7d0;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .card {
      background: rgba(16, 28, 23, 0.92);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 18px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
      margin-bottom: 16px;
      backdrop-filter: blur(10px);
    }

    .card h2,
    .card h3 {
      margin-top: 0;
    }

    .muted { color: var(--muted); }

    .match-button-grid {
      display: grid;
      gap: 12px;
      margin-top: 14px;
    }

    .match-status-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }

    .match-status-card {
      border-radius: 16px;
      padding: 10px 12px;
      background: rgba(15, 23, 42, 0.78);
      border: 1px solid var(--border);
      font-size: 12px;
    }

    .match-status-card.active {
      outline: 2px solid var(--gold);
    }

    .match-status-name {
      font-weight: 1000;
      margin-bottom: 4px;
    }

    .match-status-text {
      color: var(--muted);
      font-weight: 800;
    }

    .match-status-card.red {
      border-left: 5px solid var(--red);
    }

    .match-status-card.blue {
      border-left: 5px solid var(--blue);
    }

    .match-status-card.tie {
      border-left: 5px solid var(--gold);
    }

    button {
      border: 0;
      border-radius: 18px;
      min-height: 54px;
      padding: 12px 16px;
      color: white;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
    }

    .score-match-btn {
      background: linear-gradient(135deg, var(--green), var(--green2));
      width: 100%;
      text-align: left;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .score-match-btn span:last-child {
      opacity: 0.9;
      font-size: 13px;
      white-space: nowrap;
    }

    .gray-btn { background: #334155; }
    .green-btn { background: linear-gradient(135deg, var(--green), var(--green2)); }

    .hole-title-wrap {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 16px;
    }

    .hole-title {
      font-size: clamp(42px, 12vw, 72px);
      line-height: 1;
      font-weight: 1000;
      letter-spacing: -2px;
    }

    .hole-pill {
      border-radius: 999px;
      padding: 8px 12px;
      background: rgba(245, 197, 66, 0.15);
      border: 1px solid rgba(245, 197, 66, 0.28);
      color: #fde68a;
      font-size: 13px;
      font-weight: 900;
      white-space: nowrap;
    }

    .scores-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .score-team {
      border-radius: 18px;
      padding: 14px;
      background: rgba(15, 23, 42, 0.78);
      border: 1px solid var(--border);
    }

    .score-team.red { border-left: 5px solid var(--red); }
    .score-team.blue { border-left: 5px solid var(--blue); }

    .score-team label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 8px;
      font-weight: 900;
      text-align: center;
    }

    .score-control {
      display: grid;
      grid-template-columns: 64px 1fr 64px;
      gap: 10px;
      align-items: center;
    }

    .score-display {
      min-height: 76px;
      border-radius: 18px;
      border: 1px solid var(--border);
      background: #020617;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      font-weight: 1000;
    }

    .winner-bar {
      margin-top: 14px;
      border-radius: 16px;
      padding: 12px;
      text-align: center;
      font-weight: 900;
      font-size: 15px;
    }

    .winner-red {
      background: rgba(220, 38, 38, 0.18);
      border: 1px solid rgba(220, 38, 38, 0.35);
      color: #fecaca;
    }

    .winner-blue {
      background: rgba(37, 99, 235, 0.18);
      border: 1px solid rgba(37, 99, 235, 0.35);
      color: #bfdbfe;
    }

    .winner-tie {
      background: rgba(245, 158, 11, 0.18);
      border: 1px solid rgba(245, 158, 11, 0.35);
      color: #fde68a;
    }

    .nav-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    .save-btn {
      width: 100%;
      margin-top: 14px;
      background: linear-gradient(135deg, var(--green), var(--green2));
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 12px;
      min-height: 52px;
      padding: 0 18px;
      border-radius: 16px;
      background: rgba(255,255,255,0.08);
      border: 1px solid var(--border);
      color: white;
      text-decoration: none;
      font-weight: 800;
      width: 100%;
    }

    .empty-state {
      text-align: center;
      padding: 70px 18px;
    }

    @media (max-width: 720px) {
      .topbar {
        flex-direction: column;
        align-items: flex-start;
      }

      .scores-grid {
        grid-template-columns: 1fr;
      }

      .hole-title-wrap {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="topbar">
      <div>
        <h1>Player Match</h1>
        <p>Score one hole at a time.</p>
      </div>

      <div class="status" id="connectionStatus">Connecting to Firebase...</div>
    </div>

    <div id="content"></div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import {
      getDatabase,
      ref,
      onValue,
      update
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";

    const firebaseConfig = {
      apiKey: "PASTE_YOUR_API_KEY_HERE",
      authDomain: "golftournament-44a54.firebaseapp.com",
      databaseURL: "https://golftournament-44a54-default-rtdb.firebaseio.com",
      projectId: "golftournament-44a54",
      storageBucket: "golftournament-44a54.firebasestorage.app",
      messagingSenderId: "PASTE_YOUR_SENDER_ID_HERE",
      appId: "PASTE_YOUR_APP_ID_HERE"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const content = document.getElementById("content");
    const connectionStatus = document.getElementById("connectionStatus");

    let tournaments = {};
    let playerMatches = [];
    let selectedMatchKey = null;
    let currentHole = 1;

    const params = new URLSearchParams(window.location.search);
    const playerCode = params.get("code") || "";

    onValue(ref(db, ".info/connected"), snapshot => {
      connectionStatus.textContent = snapshot.val()
        ? "Connected to Firebase"
        : "Disconnected";
    });

    onValue(ref(db, "tournaments"), snapshot => {
      tournaments = snapshot.val() || {};
      playerMatches = findPlayerMatches(playerCode);

      if (selectedMatchKey && !playerMatches.some(item => item.key === selectedMatchKey)) {
        selectedMatchKey = null;
        currentHole = 1;
      }

      render();
    });

    function render() {
      if (!/^\d{4}$/.test(playerCode)) {
        showError("Missing or invalid player code.");
        return;
      }

      if (!playerMatches.length) {
        showError("No active matches found for this player code.");
        return;
      }

      if (!selectedMatchKey) {
        renderMatchPicker();
        return;
      }

      const matchData = playerMatches.find(item => item.key === selectedMatchKey);

      if (!matchData) {
        selectedMatchKey = null;
        renderMatchPicker();
        return;
      }

      renderHoleScorer(matchData);
    }

    function renderMatchPicker() {
      const playerName = playerMatches[0]?.player?.name || "Player";

      content.innerHTML = `
        <div class="card">
          <h2>Welcome, ${escapeHtml(playerName)}</h2>
          <div class="muted">Select the match you want to score.</div>

          <div class="match-button-grid">
            ${playerMatches.map(item => `
              <button class="score-match-btn" onclick="selectMatch('${item.key}')">
                <span>Score ${escapeHtml(item.match.name || "Match")}</span>
                <span>${escapeHtml(getMatchProgress(item.match))}</span>
              </button>
            `).join("")}
          </div>
        </div>

        <a href="index.html" class="back-btn">Back to Home</a>
      `;
    }

    function renderHoleScorer(matchData) {
      const { tournament, match, matchId } = matchData;
      const holeData = match.holes?.[currentHole] || {};
      const redScore = holeData.redScore || 4;
      const blueScore = holeData.blueScore || 4;
      const winner = getHoleWinnerText(redScore, blueScore);
      const tournamentLead = getTournamentMatchLead(tournament);

      content.innerHTML = `
        ${renderMatchStatusCards(tournament, matchId)}

        <div class="card">
          <div class="winner-bar ${tournamentLead.className}">
            ${tournamentLead.text}
          </div>

          <div class="hole-title-wrap">
            <div>
              <div class="hole-title">Hole ${currentHole}</div>
            </div>

            <div class="hole-pill">${escapeHtml(getMatchProgress(match))}</div>
          </div>

          <div class="scores-grid">
            <div class="score-team red">
              <label>Red Team Score</label>

              <div class="score-control">
                <button class="gray-btn" onclick="changeScore('redScore', -1)">−</button>

                <div class="score-display" id="redScore">${escapeHtml(redScore)}</div>

                <button class="green-btn" onclick="changeScore('redScore', 1)">+</button>
              </div>
            </div>

            <div class="score-team blue">
              <label>Blue Team Score</label>

              <div class="score-control">
                <button class="gray-btn" onclick="changeScore('blueScore', -1)">−</button>

                <div class="score-display" id="blueScore">${escapeHtml(blueScore)}</div>

                <button class="green-btn" onclick="changeScore('blueScore', 1)">+</button>
              </div>
            </div>
          </div>

          <button class="save-btn" onclick="saveCurrentHole()">Save Hole ${currentHole}</button>

          <div class="winner-bar ${winner.className}">${winner.text}</div>

          <div class="nav-grid">
            <button class="gray-btn" onclick="previousHole()">Previous Hole</button>
            <button class="green-btn" onclick="nextHole()">Next Hole</button>
          </div>

          <button class="gray-btn" style="width:100%; margin-top:10px;" onclick="backToMatches()">Back to Match List</button>
        </div>
      `;
    }

    function renderMatchStatusCards(tournament, activeMatchId) {
      const matches = Object.entries(tournament.matches || {});

      if (!matches.length) return "";

      return `
        <div class="match-status-grid">
          ${matches.map(([matchId, match]) => {
            const status = getMatchStatus(match);
            const activeClass = matchId === activeMatchId ? "active" : "";

            return `
              <div class="match-status-card ${status.className} ${activeClass}">
                <div class="match-status-name">${escapeHtml(match.name || "Match")}</div>
                <div class="match-status-text">${escapeHtml(status.text)}</div>
              </div>
            `;
          }).join("")}
        </div>
      `;
    }

    function getMatchStatus(match) {
      let redHoles = 0;
      let blueHoles = 0;
      let scored = 0;

      for (let i = 1; i <= 18; i++) {
        const hole = match.holes?.[i] || {};
        const red = Number(hole.redScore || 0);
        const blue = Number(hole.blueScore || 0);

        if (!red || !blue) continue;

        scored++;

        if (red < blue) redHoles++;
        if (blue < red) blueHoles++;
      }

      const remaining = 18 - scored;
      const lead = Math.abs(redHoles - blueHoles);

      if (!scored) {
        return {
          className: "tie",
          text: "Not started"
        };
      }

      if (lead === 0) {
        return {
          className: "tie",
          text: remaining > 0 ? `All square with ${remaining} holes to go` : "Match tied"
        };
      }

      const leader = redHoles > blueHoles ? "Red" : "Blue";
      const className = redHoles > blueHoles ? "red" : "blue";

      if (lead > remaining) {
        return {
          className,
          text: remaining === 0 ? `${leader} wins ${lead} up` : `${leader} wins ${lead} and ${remaining}`
        };
      }

      return {
        className,
        text: `${leader} ${lead} up with ${remaining} holes to go`
      };
    }

    function getTournamentMatchLead(tournament) {
      let redMatches = 0;
      let blueMatches = 0;

      Object.values(tournament.matches || {}).forEach(match => {
        let redHoles = 0;
        let blueHoles = 0;

        Object.values(match.holes || {}).forEach(hole => {
          const red = Number(hole?.redScore || 0);
          const blue = Number(hole?.blueScore || 0);

          if (!red || !blue) return;

          if (red < blue) redHoles++;
          if (blue < red) blueHoles++;
        });

        if (redHoles > blueHoles) redMatches++;
        if (blueHoles > redHoles) blueMatches++;
      });

      if (redMatches > blueMatches) {
        return {
          className: "winner-red",
          text: `Red currently leads matches ${redMatches}-${blueMatches}`
        };
      }

      if (blueMatches > redMatches) {
        return {
          className: "winner-blue",
          text: `Blue currently leads matches ${blueMatches}-${redMatches}`
        };
      }

      return {
        className: "winner-tie",
        text: `Matches currently tied ${redMatches}-${blueMatches}`
      };
    }

    window.changeScore = function(id, amount) {
      const el = document.getElementById(id);
      if (!el) return;

      const current = Number(el.textContent || 4);
      const next = Math.max(1, Math.min(20, current + amount));

      el.textContent = next;
    };

    window.selectMatch = function(key) {
      selectedMatchKey = key;
      currentHole = getFirstOpenHole(playerMatches.find(item => item.key === key)?.match || {});
      render();
    };

    window.backToMatches = function() {
      selectedMatchKey = null;
      currentHole = 1;
      render();
    };

    window.previousHole = async function() {
      await saveCurrentHole(false);
      currentHole = Math.max(1, currentHole - 1);
      render();
    };

    window.nextHole = async function() {
      await saveCurrentHole(false);
      currentHole = Math.min(18, currentHole + 1);
      render();
    };

    window.saveCurrentHole = async function(advanceAfterSave = true) {
      const matchData = playerMatches.find(item => item.key === selectedMatchKey);
      if (!matchData) return;

      const redScore = document.getElementById("redScore")?.textContent.trim();
      const blueScore = document.getElementById("blueScore")?.textContent.trim();

      const redNum = Number(redScore);
      const blueNum = Number(blueScore);

      if (redNum < 1 || blueNum < 1) {
        alert("Scores must be greater than 0.");
        return;
      }

      await update(ref(db, `tournaments/${matchData.tournamentId}/matches/${matchData.matchId}/holes/${currentHole}`), {
        redScore: redNum,
        blueScore: blueNum
      });

      if (advanceAfterSave) {
        if (currentHole < 18) {
          currentHole = currentHole + 1;
          render();
        } else {
          alert("Round complete.");
        }
      }
    };

    function findPlayerMatches(code) {
      if (!/^\d{4}$/.test(code)) return [];

      const results = [];

      for (const [tournamentId, tournament] of Object.entries(tournaments)) {
        const players = tournament.players || {};
        const matches = tournament.matches || {};

        let matchingPlayer = null;

        for (const [playerId, player] of Object.entries(players)) {
          if (player.code === code) {
            matchingPlayer = { id: playerId, ...player };
            break;
          }
        }

        if (!matchingPlayer) continue;

        for (const [matchId, match] of Object.entries(matches)) {
          const ids = [...(match.red || []), ...(match.blue || [])];

          if (!ids.includes(matchingPlayer.id)) continue;

          results.push({
            key: `${tournamentId}_${matchId}`,
            tournamentId,
            tournament,
            matchId,
            match,
            player: matchingPlayer
          });
        }
      }

      return results.sort((a, b) => (a.match.createdAt || 0) - (b.match.createdAt || 0));
    }

    function getFirstOpenHole(match) {
      for (let i = 1; i <= 18; i++) {
        const hole = match.holes?.[i] || {};
        if (!hole.redScore || !hole.blueScore) return i;
      }
      return 18;
    }

    function getMatchProgress(match) {
      let scored = 0;

      Object.values(match.holes || {}).forEach(hole => {
        if (hole?.redScore && hole?.blueScore) scored++;
      });

      return `${scored}/18 Scored`;
    }

    function getHoleWinnerText(redScore, blueScore) {
      if (!redScore || !blueScore) {
        return {
          className: "winner-tie",
          text: "Waiting for scores"
        };
      }

      const red = Number(redScore);
      const blue = Number(blueScore);

      if (red < blue) {
        return {
          className: "winner-red",
          text: "Red Team Wins Hole"
        };
      }

      if (blue < red) {
        return {
          className: "winner-blue",
          text: "Blue Team Wins Hole"
        };
      }

      return {
        className: "winner-tie",
        text: "Hole Tied"
      };
    }

    function showError(message) {
      content.innerHTML = `
        <div class="card empty-state">
          <h2>Match Not Found</h2>
          <div class="muted">${escapeHtml(message)}</div>

          <a href="index.html" class="back-btn">Back to Home</a>
        </div>
      `;
    }

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
