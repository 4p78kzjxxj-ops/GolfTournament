<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spectator View</title>

  <style>
    :root {
      --bg: #08110d;
      --card: #101c17;
      --text: #f8fafc;
      --muted: #9ca3af;
      --green: #16a34a;
      --red: #dc2626;
      --blue: #2563eb;
      --gold: #f5c542;
      --border: rgba(255,255,255,0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top, rgba(34, 197, 94, 0.14), transparent 26%),
        linear-gradient(180deg, #06351f 0%, var(--bg) 42%, #020617 100%);
    }

    .page {
      width: min(980px, 100%);
      margin: 0 auto;
      padding: 14px 10px 34px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 6vw, 38px);
      letter-spacing: -0.8px;
      line-height: 1;
    }

    .subtitle {
      margin: 3px 0 0;
      color: #d1fae5;
      font-size: 13px;
    }

    .status {
      display: inline-flex;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(22, 163, 74, 0.18);
      border: 1px solid rgba(22, 163, 74, 0.35);
      color: #bbf7d0;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .card,
    .match-card {
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 12px;
      margin-bottom: 10px;
      box-shadow: 0 12px 34px rgba(0,0,0,0.24);
      backdrop-filter: blur(10px);
    }

    .card {
      background: rgba(16, 28, 23, 0.92);
    }

    .match-card {
      background: rgba(16, 28, 23, 0.92);
    }

    .match-red {
      background:
        linear-gradient(135deg, rgba(220, 38, 38, 0.38), rgba(16, 28, 23, 0.94) 60%),
        rgba(16, 28, 23, 0.92);
      border-color: rgba(220, 38, 38, 0.55);
    }

    .match-blue {
      background:
        linear-gradient(135deg, rgba(37, 99, 235, 0.40), rgba(16, 28, 23, 0.94) 60%),
        rgba(16, 28, 23, 0.92);
      border-color: rgba(37, 99, 235, 0.55);
    }

    .match-tie {
      background:
        linear-gradient(135deg, rgba(245, 197, 66, 0.20), rgba(16, 28, 23, 0.94) 62%),
        rgba(16, 28, 23, 0.92);
      border-color: rgba(245, 197, 66, 0.32);
    }

    .matches {
      display: grid;
      gap: 10px;
    }

    .match-header {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: flex-start;
      margin-bottom: 10px;
    }

    .match-title {
      font-size: 18px;
      font-weight: 950;
      line-height: 1.1;
    }

    .match-subtitle {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }

    .score-badge {
      border-radius: 999px;
      padding: 6px 10px;
      font-weight: 950;
      font-size: 13px;
      white-space: nowrap;
    }

    .score-red {
      background: rgba(220, 38, 38, 0.32);
      border: 1px solid rgba(220, 38, 38, 0.55);
      color: #fecaca;
    }

    .score-blue {
      background: rgba(37, 99, 235, 0.32);
      border: 1px solid rgba(37, 99, 235, 0.55);
      color: #bfdbfe;
    }

    .score-tie {
      background: rgba(245, 197, 66, 0.18);
      border: 1px solid rgba(245, 197, 66, 0.34);
      color: #fde68a;
    }

    .matchup-line {
      margin: 10px 0;
      padding: 10px;
      border-radius: 14px;
      background: rgba(2, 6, 23, 0.72);
      border: 1px solid var(--border);
      text-align: center;
      font-size: 15px;
      font-weight: 950;
      line-height: 1.35;
    }

    .matchup-red {
      color: #fecaca;
    }

    .matchup-blue {
      color: #bfdbfe;
    }

    .matchup-vs {
      color: var(--muted);
      margin: 0 6px;
      font-size: 13px;
      font-weight: 900;
    }

    .nine-label {
      margin: 8px 0 6px;
      color: #d1fae5;
      font-size: 12px;
      font-weight: 950;
      text-transform: uppercase;
      letter-spacing: 0.7px;
    }

    .holes {
      display: grid;
      grid-template-columns: repeat(9, minmax(0, 1fr));
      gap: 5px;
    }

    .hole-bubble {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 999px;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: rgba(2, 6, 23, 0.88);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
      min-width: 0;
    }

    .hole-number {
      font-size: clamp(8px, 2.3vw, 11px);
      font-weight: 950;
      line-height: 1;
      opacity: 0.95;
    }

    .bubble-red {
      background: var(--red);
      border-color: rgba(255,255,255,0.24);
      color: white;
    }

    .bubble-blue {
      background: var(--blue);
      border-color: rgba(255,255,255,0.24);
      color: white;
    }

    .bubble-tie {
      background: var(--gold);
      border-color: rgba(255,255,255,0.24);
      color: #111827;
    }

    .bubble-empty {
      color: var(--muted);
    }

    .legend {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      display: inline-block;
    }

    .dot.red { background: var(--red); }
    .dot.blue { background: var(--blue); }
    .dot.gold { background: var(--gold); }

    .muted { color: var(--muted); }

    .back-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 16px;
      border-radius: 14px;
      background: rgba(255,255,255,0.08);
      border: 1px solid var(--border);
      color: white;
      text-decoration: none;
      font-weight: 850;
      margin-top: 10px;
      font-size: 14px;
    }

    @media (max-width: 700px) {
      .topbar,
      .match-header {
        flex-direction: column;
        align-items: flex-start;
      }

      .page {
        padding-left: 8px;
        padding-right: 8px;
      }

      .holes {
        gap: 4px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="topbar">
      <div>
        <h1>Spectator View</h1>
        <p id="subtitle" class="subtitle">Live tournament matches</p>
      </div>
      <div id="connectionStatus" class="status">Connecting...</div>
    </div>

    <div id="tournamentScore"></div>
    <div id="content"></div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";

    const firebaseConfig = {
      apiKey: "PASTE_YOUR_API_KEY_HERE",
      authDomain: "golftournament-44a54.firebaseapp.com",
      databaseURL: "https://golftournament-44a54-default-rtdb.firebaseio.com",
      projectId: "golftournament-44a54",
      storageBucket: "golftournament-44a54.firebasestorage.app",
      messagingSenderId: "PASTE_YOUR_SENDER_ID_HERE",
      appId: "PASTE_YOUR_APP_ID_HERE"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const params = new URLSearchParams(window.location.search);
    const tournamentId = params.get("tournamentId") || "";

    const content = document.getElementById("content");
    const tournamentScore = document.getElementById("tournamentScore");
    const subtitle = document.getElementById("subtitle");
    const connectionStatus = document.getElementById("connectionStatus");

    let tournament = null;

    onValue(ref(db, ".info/connected"), snapshot => {
      connectionStatus.textContent = snapshot.val() ? "Live" : "Disconnected";
    });

    if (!tournamentId) {
      showError("No tournament selected.");
    } else {
      onValue(ref(db, `tournaments/${tournamentId}`), snapshot => {
        tournament = snapshot.val();
        render();
      });
    }

    function render() {
      if (!tournament) {
        showError("Tournament not found.");
        return;
      }

      subtitle.textContent = `${tournament.name || "Tournament"}${tournament.date ? " · " + tournament.date : ""}`;

      const matches = Object.entries(tournament.matches || {}).map(([id, match]) => ({ id, ...match }));

      if (!matches.length) {
        tournamentScore.innerHTML = "";
        content.innerHTML = `
          <div class="card">
            <h2>No matches yet</h2>
            <div class="muted">Matches will appear here after the admin creates them.</div>
            <a href="index.html" class="back-btn">Back to Home</a>
          </div>
        `;
        return;
      }

      renderTournamentSummary(matches);

      content.innerHTML = `
        <div class="matches">
          ${matches.map((match, index) => renderMatch(match, index)).join("")}
        </div>
        <a href="index.html" class="back-btn">Back to Home</a>
      `;
    }

    function renderTournamentSummary(matches) {
      let redWins = 0;
      let blueWins = 0;

      matches.forEach(match => {
        const winner = calculateMatchWinner(match);
        if (winner === "red") redWins++;
        if (winner === "blue") blueWins++;
      });

      let summaryClass = "score-tie";
      let summaryText = `Tournament All Square • ${redWins}-${blueWins}`;

      if (redWins > blueWins) {
        summaryClass = "score-red";
        summaryText = `Red Teams Lead Matches ${redWins}-${blueWins}`;
      } else if (blueWins > redWins) {
        summaryClass = "score-blue";
        summaryText = `Blue Teams Lead Matches ${blueWins}-${redWins}`;
      }

      tournamentScore.innerHTML = `
        <div class="match-card match-tie" style="padding:10px 12px; margin-bottom:10px;">
          <div class="score-badge ${summaryClass}" style="width:100%; justify-content:center; display:flex; font-size:15px; padding:10px;">
            ${escapeHtml(summaryText)}
          </div>
        </div>
      `;
    }

    function renderMatch(match, index) {
      const redPlayers = (match.red || []).map(playerLastName);
      const bluePlayers = (match.blue || []).map(playerLastName);
      const totals = calculateTeamTotals(match);
      const leaderClass = calculateMatchCardClass(match);

      return `
        <div class="match-card ${leaderClass}">
          <div class="match-header">
            <div>
              <div class="match-title">${escapeHtml(match.name || `Match ${index + 1}`)}</div>
              <div class="match-subtitle">2v2 Best Ball</div>
            </div>
            <div class="score-badge ${calculateMatchLeaderClass(match)}">${escapeHtml(calculateMatchStatus(match))}</div>
          </div>

          <div class="matchup-line">
  <span class="matchup-red">
    ${redPlayers.map(name => escapeHtml(name)).join(" / ")} (${totals.red})
  </span>
  <span class="matchup-vs">vs</span>
  <span class="matchup-blue">
    ${bluePlayers.map(name => escapeHtml(name)).join(" / ")} (${totals.blue})
  </span>
</div>

          <div class="nine-label">Front 9</div>
          <div class="holes">
            ${renderHoleBubbles(match, 1, 9)}
          </div>

          <div class="nine-label">Back 9</div>
          <div class="holes">
            ${renderHoleBubbles(match, 10, 18)}
          </div>

          <div class="legend">
            <span class="legend-item"><span class="dot red"></span>Red won</span>
            <span class="legend-item"><span class="dot blue"></span>Blue won</span>
            <span class="legend-item"><span class="dot gold"></span>Tie</span>
          </div>
        </div>
      `;
    }

    function renderHoleBubbles(match, start, end) {
      let html = "";

      for (let i = start; i <= end; i++) {
        const hole = match.holes?.[i] || {};
        const redScore = hole.redScore || "";
        const blueScore = hole.blueScore || "";

        let bubbleClass = "bubble-empty";

        if (redScore && blueScore) {
          if (Number(redScore) < Number(blueScore)) {
            bubbleClass = "bubble-red";
          } else if (Number(blueScore) < Number(redScore)) {
            bubbleClass = "bubble-blue";
          } else {
            bubbleClass = "bubble-tie";
          }
        }

        html += `
          <div class="hole-bubble ${bubbleClass}" title="Hole ${i}">
            <div class="hole-number">${i}</div>
          </div>
        `;
      }

      return html;
    }

    function calculateMatchWinner(match) {
      let redWins = 0;
      let blueWins = 0;

      Object.values(match.holes || {}).forEach(hole => {
        const redScore = hole?.redScore;
        const blueScore = hole?.blueScore;

        if (!redScore || !blueScore) return;

        if (Number(redScore) < Number(blueScore)) redWins++;
        if (Number(blueScore) < Number(redScore)) blueWins++;
      });

      if (redWins > blueWins) return "red";
      if (blueWins > redWins) return "blue";
      return "tie";
    }

    function calculateMatchLeaderClass(match) {
      const winner = calculateMatchWinner(match);
      if (winner === "red") return "score-red";
      if (winner === "blue") return "score-blue";
      return "score-tie";
    }

    function calculateMatchCardClass(match) {
      const winner = calculateMatchWinner(match);
      if (winner === "red") return "match-red";
      if (winner === "blue") return "match-blue";
      return "match-tie";
    }

    function calculateTeamTotals(match) {
      let red = 0;
      let blue = 0;

      Object.values(match.holes || {}).forEach(hole => {
        if (hole?.redScore) red += Number(hole.redScore);
        if (hole?.blueScore) blue += Number(hole.blueScore);
      });

      return { red, blue };
    }

    function calculateMatchStatus(match) {
      let redWins = 0;
      let blueWins = 0;

      Object.values(match.holes || {}).forEach(hole => {
        const redScore = hole?.redScore;
        const blueScore = hole?.blueScore;

        if (!redScore || !blueScore) return;

        if (Number(redScore) < Number(blueScore)) redWins++;
        if (Number(blueScore) < Number(redScore)) blueWins++;
      });

      const diff = redWins - blueWins;

      if (diff === 0) return "All Square";
      if (diff > 0) return `Red ${diff} Up`;
      return `Blue ${Math.abs(diff)} Up`;
    }

    function playerName(playerId) {
      return tournament?.players?.[playerId]?.name || "Unknown Player";
    }

    function playerLastName(playerId) {
      const fullName = playerName(playerId).trim();
      const parts = fullName.split(/\s+/).filter(Boolean);
      return parts.length ? parts[parts.length - 1] : fullName;
    }

    function showError(message) {
      tournamentScore.innerHTML = "";
      content.innerHTML = `
        <div class="card">
          <h2>Unable to Load</h2>
          <div class="muted">${escapeHtml(message)}</div>
          <a href="index.html" class="back-btn">Back to Home</a>
        </div>
      `;
    }

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
